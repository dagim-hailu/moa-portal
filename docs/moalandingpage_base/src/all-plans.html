<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>All Plans | Planning & Reporting System</title>
    <!-- Google Fonts + Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f6f9fe;
            font-family: 'Inter', sans-serif;
            color: #1e2a3e;
            padding: 32px 28px;
        }

        .plans-container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* cards, shadows */
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02), 0 2px 4px rgba(0, 0, 0, 0.02);
            border: 1px solid #eef2fa;
            transition: all 0.2s ease;
        }

        /* header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 32px;
        }
        .title h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #1f6e43, #2c9f6e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .title p {
            color: #5c6f87;
            margin-top: 6px;
            font-size: 0.9rem;
        }
        .action-buttons {
            display: flex;
            gap: 14px;
        }
        .btn-primary {
            background: #1f6e43;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:hover { background: #145e3a; transform: translateY(-1px);}
        .btn-outline {
            background: white;
            border: 1px solid #dce5ef;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .btn-outline:hover { background: #f1f5fb; border-color: #bcd0e4;}

        /* filters row */
        .filters-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            background: white;
            padding: 14px 24px;
            border-radius: 60px;
            border: 1px solid #eef3fc;
            align-items: center;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafd;
            padding: 6px 16px;
            border-radius: 40px;
        }
        .filter-group select, .filter-group input {
            border: none;
            background: transparent;
            padding: 8px 4px;
            font-weight: 500;
            outline: none;
            font-family: 'Inter';
        }
        .search-input {
            flex: 1;
            min-width: 200px;
        }
        .view-toggle {
            display: flex;
            gap: 6px;
            background: #edf2f9;
            border-radius: 48px;
            padding: 4px;
        }
        .view-btn {
            background: transparent;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
        }
        .view-btn.active {
            background: white;
            color: #1f6e43;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        /* summary cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 36px;
        }
        .stat-card {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .stat-left h4 { font-size: 0.8rem; font-weight: 500; color: #5a6e8a; }
        .stat-left .stat-number { font-size: 2rem; font-weight: 800; margin-top: 8px; }

        /* Table view */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 18px 12px;
            background: #fafcff;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 1px solid #eef2f8;
        }
        td {
            padding: 16px 12px;
            border-bottom: 1px solid #f1f5fb;
            font-size: 0.85rem;
            vertical-align: middle;
        }
        .progress-bar {
            background: #e4edf2;
            border-radius: 20px;
            height: 8px;
            width: 100%;
            overflow: hidden;
        }
        .progress-fill {
            background: #1f6e43;
            height: 100%;
            border-radius: 20px;
            width: 0%;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .status-active { background: #e0f2e9; color: #1f6e43; }
        .status-completed { background: #e1f0fa; color: #2c6e9e; }
        .status-delayed { background: #ffe6e5; color: #c2412c; }
        .action-icons i {
            margin: 0 6px;
            cursor: pointer;
            color: #7c8ea0;
            transition: 0.2s;
        }
        .action-icons i:hover { color: #1f6e43; }
        .checkbox-col { width: 30px; }

        /* Card grid view */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
            margin-top: 16px;
        }
        .plan-card {
            background: white;
            border-radius: 28px;
            padding: 20px;
            border: 1px solid #eef3fc;
            transition: all 0.2s;
        }
        .plan-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -12px rgba(0,0,0,0.1);}
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-progress { margin: 16px 0; }
        .kpi-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #f0f4fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        /* pagination */
        .pagination {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
        }
        .page-btn {
            background: white;
            border: 1px solid #dee6ef;
            padding: 8px 14px;
            border-radius: 30px;
            cursor: pointer;
        }
        .active-page { background: #1f6e43; color: white; border: none; }

        /* modal preview */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 550px;
            border-radius: 32px;
            padding: 32px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        .warning-icon { color: #e67e22; margin-right: 6px; }
        .bulk-bar {
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
        }
        @media (max-width: 780px) {
            body { padding: 20px; }
            .filters-bar { border-radius: 28px; flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div class="plans-container">
    <!-- Header -->
    <div class="page-header">
        <div class="title">
            <h1><i class="fas fa-layer-group" style="color:#1f6e43;"></i> All Plans</h1>
            <p>View and manage all organizational plans, track progress, and KPIs.</p>
        </div>
        <div class="action-buttons">
            <button class="btn-primary" id="createPlanBtn"><i class="fas fa-plus"></i> Create New Plan</button>
            <button class="btn-outline" id="exportBtn"><i class="fas fa-download"></i> Export</button>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
        <div class="filter-group"><i class="fas fa-calendar"></i><select id="yearFilter"><option>All years</option><option>2024</option><option>2025</option><option>2026</option></select></div>
        <div class="filter-group"><i class="fas fa-flag"></i><select id="statusFilter"><option>All Status</option><option>Active</option><option>Completed</option><option>Delayed</option></select></div>
        <div class="filter-group"><i class="fas fa-building"></i><select id="deptFilter"><option>All Departments</option><option>Agriculture</option><option>Infrastructure</option><option>Education</option><option>Health</option></select></div>
        <div class="filter-group search-input"><i class="fas fa-search"></i><input type="text" id="searchPlan" placeholder="Search by name or description..."></div>
        <div class="view-toggle" id="viewToggle">
            <button class="view-btn active" data-view="table"><i class="fas fa-table"></i> Table</button>
            <button class="view-btn" data-view="card"><i class="fas fa-th-large"></i> Cards</button>
        </div>
    </div>

    <!-- Summary Cards -->
    <div class="summary-grid" id="summaryCards"></div>

    <!-- Bulk actions bar (hidden when no selection) -->
    <div id="bulkBar" class="bulk-bar" style="display: none;">
        <span id="selectedCount"></span>
        <button class="btn-outline" id="bulkDeleteBtn" style="background:#fee2e2;"><i class="fas fa-trash-alt"></i> Delete selected</button>
    </div>

    <!-- Table View Container -->
    <div id="tableView" class="card table-wrapper"></div>
    <!-- Card View Container -->
    <div id="cardView" style="display: none;"></div>

    <!-- Pagination -->
    <div class="pagination" id="paginationControls"></div>
</div>

<!-- Modal for quick preview -->
<div id="previewModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Plan details</h3>
        <div id="modalBody"></div>
        <button class="btn-primary" id="closeModalBtn" style="margin-top:20px;">Close</button>
    </div>
</div>

<script>
    // ---------- MOCK PLANS DATA ----------
    let plansData = [
        { id: 1, name: "Green Legacy Initiative", description: "Afforestation and climate resilience", owner: "Ministry of Environment", startDate: "2024-01-10", endDate: "2024-12-20", progress: 78, status: "Active", department: "Agriculture", year: 2024, kpiCompletion: 74 },
        { id: 2, name: "Digital Agriculture Platform", description: "IoT based farmer advisory", owner: "Digital AGRI", startDate: "2024-03-01", endDate: "2024-11-30", progress: 62, status: "Active", department: "Agriculture", year: 2024, kpiCompletion: 58 },
        { id: 3, name: "Irrigation Expansion Plan", description: "Small-scale irrigation schemes", owner: "Water Resources", startDate: "2023-06-01", endDate: "2024-09-15", progress: 88, status: "Active", department: "Infrastructure", year: 2024, kpiCompletion: 85 },
        { id: 4, name: "School Feeding Program", description: "Nutrition for primary schools", owner: "Ministry of Education", startDate: "2023-09-01", endDate: "2024-07-30", progress: 95, status: "Completed", department: "Education", year: 2024, kpiCompletion: 96 },
        { id: 5, name: "Rural Road Connectivity", description: "Gravel road construction", owner: "Infrastructure Unit", startDate: "2024-02-10", endDate: "2024-10-20", progress: 45, status: "Delayed", department: "Infrastructure", year: 2024, kpiCompletion: 40, delayNote: "Land acquisition delayed" },
        { id: 6, name: "Health Post Construction", description: "Rural health posts", owner: "Ministry of Health", startDate: "2024-04-01", endDate: "2024-12-15", progress: 33, status: "Active", department: "Health", year: 2024, kpiCompletion: 30 },
        { id: 7, name: "Post-Harvest Tech", description: "Storage & processing", owner: "Agri-Processing", startDate: "2024-05-01", endDate: "2025-01-31", progress: 20, status: "Active", department: "Agriculture", year: 2025, kpiCompletion: 18 },
        { id: 8, name: "Teacher Digital Skills", description: "Training program", owner: "Education Dept", startDate: "2024-01-15", endDate: "2024-08-30", progress: 100, status: "Completed", department: "Education", year: 2024, kpiCompletion: 98 },
        { id: 9, name: "Water Harvesting Dams", description: "Small dams construction", owner: "Water & Energy", startDate: "2023-10-01", endDate: "2024-11-25", progress: 68, status: "Delayed", department: "Infrastructure", year: 2024, kpiCompletion: 64 },
        { id: 10, name: "E-Governance Initiative", description: "Digital public services", owner: "ICT Authority", startDate: "2024-06-01", endDate: "2025-06-30", progress: 15, status: "Active", department: "Technology", year: 2025, kpiCompletion: 12 },
        { id: 11, name: "Agro-Industrial Park", description: "Zone development", owner: "Industry Ministry", startDate: "2024-07-01", endDate: "2025-12-31", progress: 8, status: "Active", department: "Agriculture", year: 2025, kpiCompletion: 5 },
        { id: 12, name: "Flood Prevention Plan", description: "Early warning systems", owner: "Disaster Risk", startDate: "2024-02-01", endDate: "2024-10-10", progress: 72, status: "Delayed", department: "Infrastructure", year: 2024, kpiCompletion: 68 }
    ];

    let currentView = "table";   // table or card
    let currentPage = 1;
    const rowsPerPage = 5;
    let sortColumn = "name";
    let sortDirection = "asc";
    let filters = { year: "All years", status: "All Status", department: "All Departments", search: "" };
    let selectedPlanIds = new Set();

    // Helper: filter & sort data
    function getFilteredPlans() {
        let filtered = plansData.filter(p => {
            if (filters.year !== "All years" && p.year != filters.year) return false;
            if (filters.status !== "All Status" && p.status !== filters.status) return false;
            if (filters.department !== "All Departments" && p.department !== filters.department) return false;
            if (filters.search && !p.name.toLowerCase().includes(filters.search.toLowerCase()) && !p.description.toLowerCase().includes(filters.search.toLowerCase())) return false;
            return true;
        });
        // sorting
        filtered.sort((a,b) => {
            let aVal = a[sortColumn];
            let bVal = b[sortColumn];
            if (sortColumn === "progress" || sortColumn === "kpiCompletion") {
                return sortDirection === "asc" ? aVal - bVal : bVal - aVal;
            }
            if (typeof aVal === "string") return sortDirection === "asc" ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
            return 0;
        });
        return filtered;
    }

    // Render summary stats
    function renderSummary() {
        const all = getFilteredPlans();
        const total = all.length;
        const active = all.filter(p => p.status === "Active").length;
        const completed = all.filter(p => p.status === "Completed").length;
        const delayed = all.filter(p => p.status === "Delayed").length;
        document.getElementById("summaryCards").innerHTML = `
            <div class="card stat-card"><div class="stat-left"><h4>Total Plans</h4><div class="stat-number">${total}</div></div><i class="fas fa-folder-open fa-2x" style="color:#2b7a58;"></i></div>
            <div class="card stat-card"><div class="stat-left"><h4>Active</h4><div class="stat-number">${active}</div></div><i class="fas fa-play-circle fa-2x" style="color:#3b82f6;"></i></div>
            <div class="card stat-card"><div class="stat-left"><h4>Completed</h4><div class="stat-number">${completed}</div></div><i class="fas fa-check-circle fa-2x" style="color:#10b981;"></i></div>
            <div class="card stat-card"><div class="stat-left"><h4>Delayed</h4><div class="stat-number">${delayed}</div></div><i class="fas fa-exclamation-triangle fa-2x" style="color:#e67e22;"></i></div>
        `;
    }

    // Table rendering
    function renderTableView() {
        const filtered = getFilteredPlans();
        const start = (currentPage-1)*rowsPerPage;
        const paginated = filtered.slice(start, start+rowsPerPage);
        const container = document.getElementById("tableView");
        if (paginated.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox fa-3x" style="color:#cbd5e1;"></i><p>No plans match the filters</p><button class="btn-primary" id="emptyCreateBtn">+ Create Plan</button></div>`;
            document.getElementById("emptyCreateBtn")?.addEventListener("click", () => alert("Open create plan modal (demo)"));
            return;
        }
        let html = `<table><thead><tr><th class="checkbox-col"><input type="checkbox" id="selectAllCheckbox"></th><th data-sort="name">Plan Name</th><th data-sort="description">Description</th><th data-sort="owner">Owner</th><th data-sort="startDate">Start/End Date</th><th data-sort="progress">Progress</th><th data-sort="status">Status</th><th>Actions</th></tr></thead><tbody>`;
        paginated.forEach(plan => {
            const progressWidth = plan.progress;
            const statusClass = plan.status === "Active" ? "status-active" : (plan.status === "Completed" ? "status-completed" : "status-delayed");
            const isDelayedWarning = (plan.status === "Delayed") ? `<i class="fas fa-exclamation-circle warning-icon"></i>` : '';
            const checkedAttr = selectedPlanIds.has(plan.id) ? "checked" : "";
            html += `<tr data-id="${plan.id}" class="plan-row">
                <td><input type="checkbox" class="plan-checkbox" data-id="${plan.id}" ${checkedAttr}></td>
                <td><strong>${escapeHtml(plan.name)}</strong> ${isDelayedWarning}</td>
                <td>${escapeHtml(plan.description.substring(0, 60))}${plan.description.length>60?'...':''}</td>
                <td>${escapeHtml(plan.owner)}</td>
                <td>${plan.startDate} → ${plan.endDate}</td>
                <td><div class="progress-bar"><div class="progress-fill" style="width:${progressWidth}%; background:${progressWidth<40?'#e67e22':(progressWidth<70?'#f4b942':'#1f6e43')}"></div></div><span style="font-size:0.7rem;">${progressWidth}%</span></td>
                <td><span class="status-badge ${statusClass}">${plan.status}</span></td>
                <td class="action-icons"><i class="fas fa-eye preview-icon" data-id="${plan.id}"></i> <i class="fas fa-edit edit-icon" data-id="${plan.id}"></i> <i class="fas fa-trash-alt delete-icon" data-id="${plan.id}"></i></td>
            </tr>`;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
        attachTableEvents();
        document.getElementById("selectAllCheckbox").addEventListener("change", (e) => {
            const allBoxes = document.querySelectorAll(".plan-checkbox");
            allBoxes.forEach(cb => cb.checked = e.target.checked);
            updateSelectedSet();
        });
    }

    function attachTableEvents() {
        document.querySelectorAll(".preview-icon").forEach(btn => btn.addEventListener("click", (e) => openPreview(parseInt(btn.dataset.id))));
        document.querySelectorAll(".edit-icon").forEach(btn => btn.addEventListener("click", (e) => alert(`Edit plan ID ${btn.dataset.id} (integration)`)));
        document.querySelectorAll(".delete-icon").forEach(btn => btn.addEventListener("click", (e) => { if(confirm("Delete plan?")) deletePlanById(parseInt(btn.dataset.id)); }));
        document.querySelectorAll(".plan-checkbox").forEach(cb => cb.addEventListener("change", updateSelectedSet));
        document.querySelectorAll("th[data-sort]").forEach(th => {
            th.addEventListener("click", () => {
                const col = th.getAttribute("data-sort");
                if(sortColumn === col) sortDirection = sortDirection === "asc" ? "desc" : "asc";
                else { sortColumn = col; sortDirection = "asc"; }
                currentPage = 1;
                refreshAll();
            });
        });
    }

    // Card view
    function renderCardView() {
        const filtered = getFilteredPlans();
        const start = (currentPage-1)*rowsPerPage;
        const paginated = filtered.slice(start, start+rowsPerPage);
        const container = document.getElementById("cardView");
        if(paginated.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-layer-group fa-3x"></i><p>No plans to show</p><button class="btn-primary" id="emptyCardCreate">+ Create Plan</button></div>`;
            return;
        }
        let cardsHtml = `<div class="card-grid">`;
        paginated.forEach(plan => {
            const kpiPercent = plan.kpiCompletion;
            const progressColor = plan.progress < 40 ? '#e67e22' : (plan.progress < 70 ? '#f4b942' : '#1f6e43');
            cardsHtml += `
                <div class="plan-card" data-id="${plan.id}">
                    <div class="card-header"><h3>${escapeHtml(plan.name)}</h3><div class="kpi-circle" style="background:#eef2fa; color:${progressColor}">${kpiPercent}%</div></div>
                    <p style="color:#5c6f87; margin:8px 0;">${escapeHtml(plan.description.substring(0, 90))}</p>
                    <div class="card-progress"><small>Progress ${plan.progress}%</small><div class="progress-bar"><div class="progress-fill" style="width:${plan.progress}%; background:${progressColor}"></div></div></div>
                    <div style="display:flex; justify-content:space-between; margin-top:12px;"><span class="status-badge ${plan.status === 'Active'?'status-active':(plan.status==='Completed'?'status-completed':'status-delayed')}">${plan.status}</span>
                    <div><i class="fas fa-eye preview-icon-card" data-id="${plan.id}" style="margin-right:12px; cursor:pointer;"></i><i class="fas fa-edit edit-card" data-id="${plan.id}" style="cursor:pointer;"></i></div></div>
                </div>`;
        });
        cardsHtml += `</div>`;
        container.innerHTML = cardsHtml;
        document.querySelectorAll(".preview-icon-card").forEach(el => el.addEventListener("click", (e) => openPreview(parseInt(el.dataset.id))));
        document.querySelectorAll(".edit-card").forEach(el => el.addEventListener("click", (e) => alert("Edit plan (demo)")));
    }

    function deletePlanById(id) {
        plansData = plansData.filter(p => p.id !== id);
        selectedPlanIds.delete(id);
        refreshAll();
        showToast("Plan deleted");
    }
    function updateSelectedSet() {
        selectedPlanIds.clear();
        document.querySelectorAll(".plan-checkbox:checked").forEach(cb => selectedPlanIds.add(parseInt(cb.dataset.id)));
        const bulkBar = document.getElementById("bulkBar");
        if(selectedPlanIds.size > 0) {
            bulkBar.style.display = "flex";
            document.getElementById("selectedCount").innerHTML = `${selectedPlanIds.size} plan(s) selected`;
        } else bulkBar.style.display = "none";
    }
    document.getElementById("bulkDeleteBtn")?.addEventListener("click", () => {
        if(confirm(`Delete ${selectedPlanIds.size} plans?`)) {
            plansData = plansData.filter(p => !selectedPlanIds.has(p.id));
            selectedPlanIds.clear();
            refreshAll();
        }
    });

    function openPreview(id) {
        const plan = plansData.find(p => p.id === id);
        if(plan) {
            document.getElementById("modalTitle").innerText = plan.name;
            document.getElementById("modalBody").innerHTML = `<p><strong>Description:</strong> ${plan.description}</p><p><strong>Owner:</strong> ${plan.owner}</p><p><strong>Timeline:</strong> ${plan.startDate} → ${plan.endDate}</p><p><strong>Progress:</strong> ${plan.progress}%</p><p><strong>KPI Completion:</strong> ${plan.kpiCompletion}%</p><p><strong>Status:</strong> ${plan.status}</p>`;
            document.getElementById("previewModal").style.display = "flex";
        }
    }
    function closeModal() { document.getElementById("previewModal").style.display = "none"; }
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    window.addEventListener("click", (e) => { if(e.target === document.getElementById("previewModal")) closeModal(); });

    function refreshAll() {
        renderSummary();
        if(currentView === "table") {
            document.getElementById("tableView").style.display = "block";
            document.getElementById("cardView").style.display = "none";
            renderTableView();
        } else {
            document.getElementById("tableView").style.display = "none";
            document.getElementById("cardView").style.display = "block";
            renderCardView();
        }
        renderPagination();
    }
    function renderPagination() {
        const filtered = getFilteredPlans();
        const totalPages = Math.ceil(filtered.length / rowsPerPage);
        let pagHtml = '';
        for(let i=1;i<=totalPages;i++) {
            pagHtml += `<button class="page-btn ${i===currentPage ? 'active-page' : ''}" data-page="${i}">${i}</button>`;
        }
        document.getElementById("paginationControls").innerHTML = `<button class="page-btn" id="prevPageBtn" ${currentPage===1 ? 'disabled' : ''}>Prev</button>${pagHtml}<button class="page-btn" id="nextPageBtn" ${currentPage===totalPages||totalPages===0 ? 'disabled' : ''}>Next</button>`;
        document.querySelectorAll("[data-page]").forEach(btn => btn.addEventListener("click", () => { currentPage = parseInt(btn.dataset.page); refreshAll(); }));
        document.getElementById("prevPageBtn")?.addEventListener("click", () => { if(currentPage>1){ currentPage--; refreshAll(); }});
        document.getElementById("nextPageBtn")?.addEventListener("click", () => { if(currentPage<totalPages){ currentPage++; refreshAll(); }});
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    function showToast(msg) { alert(msg); } // simple for demo

    // event binding for filters and view toggle
    document.getElementById("yearFilter").addEventListener("change", (e) => { filters.year = e.target.value; currentPage=1; refreshAll(); });
    document.getElementById("statusFilter").addEventListener("change", (e) => { filters.status = e.target.value; currentPage=1; refreshAll(); });
    document.getElementById("deptFilter").addEventListener("change", (e) => { filters.department = e.target.value; currentPage=1; refreshAll(); });
    document.getElementById("searchPlan").addEventListener("input", (e) => { filters.search = e.target.value; currentPage=1; refreshAll(); });
    document.getElementById("exportBtn").addEventListener("click", () => alert("Export to Excel/PDF (integration ready)"));
    document.getElementById("createPlanBtn").addEventListener("click", () => alert("Open modal: Create New Plan (extendable)"));
    document.querySelectorAll(".view-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentView = btn.dataset.view;
            currentPage = 1;
            refreshAll();
        });
    });
    refreshAll();
</script>
</body>
